<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حفلة النهارده 🎉</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; min-height: 100vh;
    font-family: 'Nunito', sans-serif;
    background: #AEE4F7;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    text-align: center;
  }

  body::before {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(circle, #FF6B9D 2.5px, transparent 2.5px),
      radial-gradient(circle, #A855F7 2.5px, transparent 2.5px),
      radial-gradient(circle, #FCD34D 2.5px, transparent 2.5px),
      radial-gradient(circle, #22C55E 2.5px, transparent 2.5px),
      radial-gradient(circle, #FB923C 2.5px, transparent 2.5px);
    background-size: 110px 110px, 80px 80px, 130px 130px, 95px 95px, 70px 70px;
    background-position: 15px 25px, 55px 65px, 25px 85px, 75px 15px, 40px 50px;
    opacity: 0.4;
  }

  .page {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2.5rem;
    padding: 2rem;
    width: 100%;
  }

  .emoji {
    font-size: clamp(4rem, 15vw, 8rem);
    animation: bounce 1.8s ease-in-out infinite;
    line-height: 1;
  }
  @keyframes bounce {
    0%,100% { transform: translateY(0) rotate(-4deg); }
    50%      { transform: translateY(-22px) rotate(4deg); }
  }

  .question {
    font-size: clamp(1.8rem, 6vw, 4.5rem);
    font-weight: 900;
    color: #1A3A5C;
    line-height: 1.4;
    max-width: 90vw;
    animation: popIn 0.6s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes popIn {
    from { opacity:0; transform:scale(0.8); }
    to   { opacity:1; transform:scale(1); }
  }

  /* YES button - static, grows over time */
  #yesBtn {
    padding: 18px 48px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.8rem;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #22C55E, #16A34A);
    color: #fff;
    box-shadow: 0 8px 28px rgba(34,197,94,0.45);
    transition: transform 0.15s, box-shadow 0.15s, font-size 0.3s, padding 0.3s;
    animation: popIn 0.6s 0.2s cubic-bezier(0.34,1.56,0.64,1) both;
    position: relative; z-index: 2;
  }
  #yesBtn:hover { transform: scale(1.08); box-shadow: 0 14px 40px rgba(34,197,94,0.6); }
  #yesBtn:active { transform: scale(0.95); }

  /* NO button - escapes, positioned fixed */
  #noBtn {
    padding: 18px 48px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.8rem;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #EF4444, #DC2626);
    color: #fff;
    box-shadow: 0 8px 28px rgba(239,68,68,0.45);
    position: fixed;
    z-index: 10;
    transition: left 0.2s cubic-bezier(0.34,1.56,0.64,1),
                top  0.2s cubic-bezier(0.34,1.56,0.64,1),
                font-size 0.3s, padding 0.3s;
    animation: popIn 0.6s 0.3s cubic-bezier(0.34,1.56,0.64,1) both;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* YES celebration screen */
  #yesScreen {
    display: none;
    flex-direction: column; align-items: center; gap: 1.5rem;
    position: relative; z-index: 1;
    animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  #yesScreen.show { display: flex; }
  .page.hide { display: none; }

  .yes-emojis {
    font-size: clamp(3rem, 12vw, 7rem);
    animation: spinPop 0.7s cubic-bezier(0.34,1.56,0.64,1) both;
  }
  @keyframes spinPop {
    from { transform: scale(0) rotate(-180deg); }
    to   { transform: scale(1) rotate(0deg); }
  }
  .yes-text {
    font-size: clamp(2rem, 8vw, 5rem);
    font-weight: 900;
    color: #1A3A5C;
    line-height: 1.3;
  }

  /* confetti */
  .confetti-piece {
    position: fixed; pointer-events: none; z-index: 999;
    animation: fall linear forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="page" id="mainPage">
  <div class="emoji">🎉</div>
  <div class="question">جاهزه لحفله النهارده الساعه عشره؟؟؟؟؟</div>
  <button id="yesBtn" onclick="sayYes()">طبعااا!!</button>
</div>

<button id="noBtn">لا</button>

<div id="yesScreen">
  <div class="yes-emojis">🎊🥳🎈</div>
  <div class="yes-text">ياااه!! أشوفك الساعه عشره 🎉</div>
</div>

<script>
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  let escapeCount = 0;
  let yesFontSize = 1.8; // rem
  let noFontSize = 1.8;  // rem

  /* Initial position of noBtn - next to yesBtn roughly */
  function placeNoBtnInitial() {
    const vw = window.innerWidth, vh = window.innerHeight;
    noBtn.style.left = (vw / 2 + 10) + 'px';
    noBtn.style.top  = (vh / 2 + 80) + 'px';
  }
  placeNoBtnInitial();

  function runAway(e) {
    escapeCount++;
    const vw = window.innerWidth, vh = window.innerHeight;
    const bw = noBtn.offsetWidth  || 120;
    const bh = noBtn.offsetHeight || 60;
    const margin = 16;

    const cx = e.clientX ?? (e.touches?.[0]?.clientX ?? vw / 2);
    const cy = e.clientY ?? (e.touches?.[0]?.clientY ?? vh / 2);

    let nx, ny, tries = 0;
    do {
      nx = margin + Math.random() * (vw - bw - margin * 2);
      ny = margin + Math.random() * (vh - bh - margin * 2);
      tries++;
    } while (tries < 40 && Math.hypot(cx - (nx + bw/2), cy - (ny + bh/2)) < 160);

    noBtn.style.left = nx + 'px';
    noBtn.style.top  = ny + 'px';

    /* grow YES button */
    yesFontSize = Math.min(5, yesFontSize + 0.25);
    yesBtn.style.fontSize = yesFontSize + 'rem';
    const yesPadV = Math.min(38, 18 + escapeCount * 2);
    const yesPadH = Math.min(90, 48 + escapeCount * 4);
    yesBtn.style.padding = yesPadV + 'px ' + yesPadH + 'px';

    /* shrink NO button */
    noFontSize = Math.max(0.6, noFontSize - 0.18);
    noBtn.style.fontSize = noFontSize + 'rem';
    const noPadV = Math.max(4, 18 - escapeCount * 1.5);
    const noPadH = Math.max(10, 48 - escapeCount * 3);
    noBtn.style.padding = noPadV + 'px ' + noPadH + 'px';
  }

  /* Desktop: hover */
  noBtn.addEventListener('mouseover', runAway);

  /* Mobile: track finger so button escapes before tap lands */
  document.addEventListener('touchmove', e => {
    const t = e.touches[0];
    const el = document.elementFromPoint(t.clientX, t.clientY);
    if (el === noBtn || noBtn.contains(el)) { e.preventDefault(); runAway(e); }
  }, { passive: false });
  /* Also on tap just in case */
  noBtn.addEventListener('touchstart', e => { e.preventDefault(); runAway(e); }, { passive: false });

  function sayYes() {
    document.getElementById('mainPage').classList.add('hide');
    noBtn.style.display = 'none';
    document.getElementById('yesScreen').classList.add('show');
    launchConfetti();
  }

  function launchConfetti() {
    const colors = ['#FF6B9D','#A855F7','#FCD34D','#22C55E','#3B82F6','#FB923C','#ffffff'];
    for (let i = 0; i < 150; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'confetti-piece';
        el.style.left = Math.random() * 100 + 'vw';
        el.style.top = '-20px';
        el.style.width = el.style.height = (8 + Math.random() * 10) + 'px';
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.borderRadius = Math.random() > 0.5 ? '50%' : '3px';
        el.style.animationDuration = (1.8 + Math.random() * 2) + 's';
        el.style.animationDelay = (Math.random() * 0.8) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 5000);
      }, i * 18);
    }
  }
</script>
</body>
</html>
